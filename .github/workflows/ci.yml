name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  html:
    name: HTML / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Initialize only the HTML dependency
        run: git submodule update --init --recursive external/litehtml
      - name: Build the standalone module
        run: |
          cmake -S html -B out/html -DCMAKE_BUILD_TYPE=Release -DNEMODEV_HTML_BUILD_TESTS=ON
          cmake --build out/html --config Release --parallel 4
      - name: Test
        run: |
          ctest --test-dir out/html -C Release --show-only=json-v1 > out/html-inventory.json
          ctest --test-dir out/html -C Release --no-tests=error --output-on-failure --output-junit "$PWD/out/html-results.xml"
          python tests/CheckCTestResults.py out/html-results.xml out/html-inventory.json
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: html-${{ matrix.os }}-logs
          path: |
            out/html-results.xml
            out/html-inventory.json
            out/html/Testing/Temporary/
          retention-days: 14
          overwrite: true

  editor:
    name: Editor / ${{ matrix.preset }} / ${{ matrix.part }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            preset: linux-x64
            ui: 'ON'
            part: 1
            parts: 3
          - os: ubuntu-22.04
            preset: linux-x64
            ui: 'ON'
            part: 2
            parts: 3
          - os: ubuntu-22.04
            preset: linux-x64
            ui: 'ON'
            part: 3
            parts: 3
          - os: windows-2022
            preset: windows-x64
            ui: 'OFF'
            part: 1
            parts: 1
          - os: macos-15
            preset: macos-arm64
            ui: 'OFF'
            part: 1
            parts: 1
    defaults:
      run:
        shell: bash
    env:
      SDL_AUDIO_DRIVER: dummy
      CCACHE_DIR: ${{ github.workspace }}/out/compiler-cache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 512M
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The architecture gate compares legacy access with a fixed source commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare editor dependencies
        run: |
          git submodule update --init --recursive external/imgui external/litehtml external/nlohmann_json
          if [[ "$RUNNER_OS" == Linux ]]; then
            git submodule update --init --recursive external/imgui_test_engine
          fi
          python -m pip install 'Pillow>=9.1'
          python tools/PrepareFonts.py
      - name: Install Linux build and software-rendering dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 ninja-build ccache dpkg-dev libgtk-3-dev libglib2.0-dev libhpdf-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libdrm-dev libgbm-dev libvulkan-dev mesa-vulkan-drivers vulkan-tools xvfb xauth
          echo 'CC=gcc-12' >> "$GITHUB_ENV"
          echo 'CXX=g++-12' >> "$GITHUB_ENV"
      - name: Verify software Vulkan before building
        if: runner.os == 'Linux'
        run: |
          export VK_DRIVER_FILES="$(dpkg -L mesa-vulkan-drivers | grep '/lvp_icd[^/]*\.json$')"
          test -f "$VK_DRIVER_FILES"
          echo "VK_DRIVER_FILES=$VK_DRIVER_FILES" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$VK_DRIVER_FILES" >> "$GITHUB_ENV"
          export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
          xvfb-run -a -s '-screen 0 1920x1080x24' vulkaninfo --summary
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja ccache libharu
      - name: Check out NeMo2 mainline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: doyaGu/NeMo2
          ref: main
          path: out/NeMo2
          persist-credentials: false
      - name: Identify NeMo2 and the build environment
        id: sdk
        run: |
          echo "revision=$(git -C out/NeMo2 rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          image="${ImageVersion:-${IMAGEVERSION:-}}"
          test -n "$image"
          if [[ "$RUNNER_OS" == Linux ]]; then
            image="$(. /etc/os-release; printf '%s-%s' "$ID" "$VERSION_ID")-$image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Restore the NeMo2 source and native build
        id: nemo2-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Preserve source mtimes and the build system's dependency records.
          # Object files alone still cause Ninja/MSBuild to rebuild the SDK.
          path: |
            out/NeMo2
            out/${{ matrix.preset }}/NeMo2
            out/${{ matrix.preset }}/lib
            out/${{ matrix.preset }}/runtime/Bin/*.dll
            out/${{ matrix.preset }}/runtime/Bin/*.dylib
            out/${{ matrix.preset }}/runtime/Bin/*.so*
            out/${{ matrix.preset }}/.ninja_log
            out/${{ matrix.preset }}/.ninja_deps
          key: nemo2-v1-${{ matrix.preset }}-${{ steps.sdk.outputs.image }}-sdl3.4.20-${{ steps.sdk.outputs.revision }}-${{ hashFiles('cmake/NeMo2.cmake', 'CMakeLists.txt', 'CMakePresets.json') }}
          # Reconfigure and build normally after restoration: Ninja/MSBuild
          # revalidate compiler flags. Deployment-only changes can reuse objects
          # from the same SDK, SDL and toolchain snapshot.
          restore-keys: nemo2-v1-${{ matrix.preset }}-${{ steps.sdk.outputs.image }}-sdl3.4.20-${{ steps.sdk.outputs.revision }}-
      - name: Initialize missing SDK components and record their revisions
        run: |
          git -C out/NeMo2 submodule update --init --recursive \
            Source/VxMath Source/CK2 Source/RenderEngine Source/Plugins Source/BuildingBlocks \
            Source/Managers/ParameterOperations Source/Managers/SdlInputManager Source/Managers/SdlSoundManager
          git -C out/NeMo2 rev-parse HEAD > out/nemo2-revision.txt
          git -C out/NeMo2 submodule status --recursive >> out/nemo2-revision.txt
          cat out/nemo2-revision.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Restore compiler cache
        if: runner.os != 'Windows'
        id: compiler-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: compiler-${{ matrix.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.revision }}-${{ github.sha }}
          restore-keys: compiler-${{ matrix.os }}-${{ runner.arch }}-
      - name: Cache the installed SDL library
        id: sdl-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: out/sdl
          key: sdl-3.4.20-shared-${{ matrix.os }}-${{ runner.arch }}-v1
      - name: Build shared SDL
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release-3.4.20 https://github.com/libsdl-org/SDL.git out/SDL
          if [[ "$RUNNER_OS" == Windows ]]; then
            cmake -S out/SDL -B out/sdl-build -G 'Visual Studio 17 2022' -A x64 -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF
          elif [[ "$RUNNER_OS" == macOS ]]; then
            cmake -S out/SDL -B out/sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DSDL_FRAMEWORK=OFF -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF
          else
            cmake -S out/SDL -B out/sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF
          fi
          cmake --build out/sdl-build --config Release --parallel 4
          cmake --install out/sdl-build --config Release --prefix '${{ github.workspace }}/out/sdl'
      - name: Save the completed SDL installation
        if: matrix.part == 1 && steps.sdl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: out/sdl
          key: sdl-3.4.20-shared-${{ matrix.os }}-${{ runner.arch }}-v1
      - name: Configure the editor and self-contained regressions
        run: |
          prefix='${{ github.workspace }}/out/sdl'
          if [[ "$RUNNER_OS" == macOS ]]; then
            prefix="$prefix;$(brew --prefix)"
          fi
          cmake --preset '${{ matrix.preset }}' \
            -DVIRTOOLS_SDK_PATH='${{ github.workspace }}/out/NeMo2' \
            -DCMAKE_PREFIX_PATH="$prefix" \
            -DCMAKE_C_COMPILER_LAUNCHER="${{ runner.os != 'Windows' && 'ccache' || '' }}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="${{ runner.os != 'Windows' && 'ccache' || '' }}" \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DVIRTOOLSDEV_BUILD_UI_TESTS=${{ matrix.ui }}
      - name: Build NeMo2
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            _CL_=-MP4 cmake --build --preset '${{ matrix.preset }}' --target VirtoolsDevRuntime --parallel 2
          else
            cmake --build --preset '${{ matrix.preset }}' --target VirtoolsDevRuntime --parallel 4
          fi
      - name: Save the completed NeMo2 build
        if: success() && matrix.part == 1 && steps.nemo2-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            out/NeMo2
            out/${{ matrix.preset }}/NeMo2
            out/${{ matrix.preset }}/lib
            out/${{ matrix.preset }}/runtime/Bin/*.dll
            out/${{ matrix.preset }}/runtime/Bin/*.dylib
            out/${{ matrix.preset }}/runtime/Bin/*.so*
            out/${{ matrix.preset }}/.ninja_log
            out/${{ matrix.preset }}/.ninja_deps
          key: ${{ steps.nemo2-cache.outputs.cache-primary-key }}
      - name: Build the editor and regressions
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            _CL_=-MP4 cmake --build --preset '${{ matrix.preset }}' --parallel 2
          else
            cmake --build --preset '${{ matrix.preset }}' --parallel 4
          fi
      - name: Save compiled objects even if a later check fails
        if: always() && matrix.part == 1 && runner.os != 'Windows' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: compiler-${{ matrix.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.revision }}-${{ github.sha }}
      - name: Record the selected test inventory
        run: |
          filters=(-L self-contained)
          if [[ "$RUNNER_OS" != Linux ]]; then filters+=(-LE gpu); fi
          ctest --preset '${{ matrix.preset }}' "${filters[@]}" --show-only=json-v1 > out/full-test-inventory.json
          if [[ "$RUNNER_OS" == Linux ]]; then filters+=(-I '${{ matrix.part }},,${{ matrix.parts }}'); fi
          ctest --preset '${{ matrix.preset }}' "${filters[@]}" --show-only=json-v1 > out/test-inventory.json
      - name: Run core and UI regressions with software Vulkan
        if: runner.os == 'Linux'
        env:
          SDL_VIDEO_DRIVER: x11
          SDL_GPU_DRIVER: vulkan
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            ctest --preset linux-x64 -L self-contained -I '${{ matrix.part }},,${{ matrix.parts }}' \
              --no-tests=error --output-junit "$PWD/out/results.xml"
          python tests/CheckCTestResults.py out/results.xml out/test-inventory.json
      - name: Run core regressions without a graphics device
        if: runner.os != 'Linux'
        env:
          SDL_VIDEO_DRIVER: dummy
        run: |
          ctest --preset '${{ matrix.preset }}' -L self-contained -LE gpu --no-tests=error --output-junit "$PWD/out/results.xml"
          python tests/CheckCTestResults.py out/results.xml out/test-inventory.json
      - name: Install the production program
        if: matrix.part == 1
        run: |
          cmake --install 'out/${{ matrix.preset }}' --config Release --prefix out/package --component Runtime
          cmake --install 'out/${{ matrix.preset }}' --config Release --prefix out/package --component Application
      - name: Check the installed Windows program without development paths
        if: runner.os == 'Windows' && matrix.part == 1
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:VIRTOOLS_PATH -ErrorAction SilentlyContinue
          & $python tests/CheckProductionBinary.py --binary out/package/Bin/NeMoDev.exe --package out/package
      - name: Check the installed Unix program
        if: runner.os != 'Windows' && matrix.part == 1
        run: python tests/CheckProductionBinary.py --binary out/package/Bin/NeMoDev --package out/package
      - name: Package and verify the native distribution
        if: matrix.part == 1
        run: |
          formats=()
          if [[ "$RUNNER_OS" == Linux ]]; then formats=(--linux-format all); fi
          python tools/Package.py --installed out/package --output out/dist \
            --version '0.0.${{ github.run_number }}' --revision '${{ github.sha }}' \
            --sdk-revisions out/nemo2-revision.txt "${formats[@]}"
      - name: Verify the relocated Windows ZIP runtime and resources
        if: runner.os == 'Windows' && matrix.part == 1
        run: python tests/CheckWindowsPackage.py out/windows-x64/runtime/Bin/NeMoDevRuntimeLayoutTests.exe out/dist/NeMoDev-*.zip
      - name: Verify the macOS bundle runtime and resources
        if: runner.os == 'macOS' && matrix.part == 1
        run: bash tests/CheckMacPackage.sh out/macos-arm64/runtime/NeMoDev.app/Contents/MacOS/NeMoDevRuntimeLayoutTests out/dist/NeMoDev-*.dmg
      - name: Upload the end-user distribution
        if: matrix.part == 1
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NeMoDev-${{ matrix.preset }}
          path: |
            out/dist/NeMoDev-*.zip
            out/dist/NeMoDev-*.deb
            out/dist/NeMoDev-*.dmg
            out/dist/NeMoDev-*.tar.xz
            out/dist/NeMoDev-*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

      - name: Upload test and configuration logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: editor-${{ matrix.preset }}-${{ matrix.part }}-logs
          path: |
            out/results.xml
            out/test-inventory.json
            out/full-test-inventory.json
            out/nemo2-revision.txt
            out/${{ matrix.preset }}/Testing/Temporary/
            out/${{ matrix.preset }}/virtoolsdev-ui/*.xml
            out/${{ matrix.preset }}/appearance-*/
            out/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14
          overwrite: true

  editor-test-partitions:
    name: Editor test inventory
    needs: editor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: editor-linux-x64-*-logs
          path: out/editor-parts
      - name: Verify that every Linux test ran exactly once
        run: python tests/CheckCTestPartitions.py out/editor-parts/editor-linux-x64-*-logs

  linux-distribution:
    name: Linux package / ${{ matrix.image }}
    needs: [editor, editor-test-partitions]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'debian:13', 'fedora:44', 'opensuse/tumbleweed:latest', 'archlinux:base']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NeMoDev-linux-x64
          path: out/distribution
      - name: Verify the same archive without build dependencies
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/out/distribution:/packages:ro" -v "$PWD/tests:/checks:ro" \
            '${{ matrix.image }}' bash /checks/CheckLinuxPackage.sh 2>&1 | tee out/distribution-check.log
      - name: Upload distribution validation logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-package-${{ strategy.job-index }}-logs
          path: out/distribution-check.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
